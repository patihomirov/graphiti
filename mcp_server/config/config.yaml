# Graphiti MCP Server Configuration
# This file supports environment variable expansion using ${VAR_NAME} or ${VAR_NAME:default_value}
#
# IMPORTANT: Set SEMAPHORE_LIMIT environment variable to control episode processing concurrency
# Default: 10 (suitable for OpenAI Tier 3, mid-tier Anthropic)
# See README.md "Concurrency and LLM Provider 429 Rate Limit Errors" section for tuning guidance

server:
  transport: "http"  # Options: stdio, sse (deprecated), http
  host: "0.0.0.0"
  port: 8000
  
llm:
  provider: "openai"  # Options: openai, azure_openai, anthropic, gemini, groq
  model: ${MODEL_NAME:gpt-5.5}
  max_tokens: 4096
  # Use json_object for OpenAI-compatible providers that accept json_schema
  # but do not reliably enforce the requested Pydantic schema.
  structured_output_mode: ${LLM_STRUCTURED_OUTPUT_MODE:json_schema}
  
  providers:
    openai:
      api_key: ${OPENAI_API_KEY}
      api_url: ${OPENAI_API_URL:https://api.openai.com/v1}
      organization_id: ${OPENAI_ORGANIZATION_ID:}
      
    azure_openai:
      api_key: ${AZURE_OPENAI_API_KEY}
      api_url: ${AZURE_OPENAI_ENDPOINT}
      api_version: ${AZURE_OPENAI_API_VERSION:2024-10-21}
      deployment_name: ${AZURE_OPENAI_DEPLOYMENT}
      use_azure_ad: ${USE_AZURE_AD:false}
      
    anthropic:
      api_key: ${ANTHROPIC_API_KEY}
      api_url: ${ANTHROPIC_API_URL:https://api.anthropic.com}
      max_retries: 3
      
    gemini:
      api_key: ${GOOGLE_API_KEY}
      project_id: ${GOOGLE_PROJECT_ID:}
      location: ${GOOGLE_LOCATION:us-central1}
      
    groq:
      api_key: ${GROQ_API_KEY}
      api_url: ${GROQ_API_URL:https://api.groq.com/openai/v1}

embedder:
  provider: "openai"  # Options: openai, azure_openai, gemini, voyage
  model: ${EMBEDDER_MODEL:text-embedding-3-small}
  dimensions: 1536
  
  providers:
    openai:
      api_key: ${OPENAI_API_KEY}
      api_url: ${OPENAI_API_URL:https://api.openai.com/v1}
      organization_id: ${OPENAI_ORGANIZATION_ID:}
      
    azure_openai:
      api_key: ${AZURE_OPENAI_API_KEY}
      api_url: ${AZURE_OPENAI_EMBEDDINGS_ENDPOINT}
      api_version: ${AZURE_OPENAI_API_VERSION:2024-10-21}
      deployment_name: ${AZURE_OPENAI_EMBEDDINGS_DEPLOYMENT}
      use_azure_ad: ${USE_AZURE_AD:false}
      
    gemini:
      api_key: ${GOOGLE_API_KEY}
      project_id: ${GOOGLE_PROJECT_ID:}
      location: ${GOOGLE_LOCATION:us-central1}
      
    voyage:
      api_key: ${VOYAGE_API_KEY}
      api_url: ${VOYAGE_API_URL:https://api.voyageai.com/v1}
      model: "voyage-3"

database:
  provider: "falkordb"  # Default: falkordb. Options: neo4j, falkordb

  providers:
    falkordb:
      uri: ${FALKORDB_URI:redis://localhost:6379}
      password: ${FALKORDB_PASSWORD:}
      database: ${FALKORDB_DATABASE:default_db}

    neo4j:
      uri: ${NEO4J_URI:bolt://localhost:7687}
      username: ${NEO4J_USER:neo4j}
      password: ${NEO4J_PASSWORD}
      database: ${NEO4J_DATABASE:neo4j}
      use_parallel_runtime: ${USE_PARALLEL_RUNTIME:false}

graphiti:
  group_id: ${GRAPHITI_GROUP_ID:main}
  episode_id_prefix: ${EPISODE_ID_PREFIX:}
  user_id: ${USER_ID:mcp_user}
  entity_types:
    - name: "Preference"
      description: "User preferences, choices, opinions, or selections (PRIORITIZE over most other types except User/Assistant)"
    - name: "Requirement"
      description: "Specific needs, features, or functionality that must be fulfilled"
    - name: "Procedure"
      description: "Standard operating procedures and sequential instructions"
    - name: "Location"
      description: "Physical or virtual places where activities occur"
    - name: "Event"
      description: "Time-bound activities, occurrences, or experiences"
    - name: "Organization"
      description: "Companies, institutions, groups, or formal entities"
    - name: "Document"
      description: "Information content in various forms (books, articles, reports, etc.)"
    - name: "Topic"
      description: "Subject of conversation, interest, or knowledge domain (use as last resort)"
    - name: "Person"
      description: "An individual human referenced in the content"
    - name: "Object"
      description: "Physical items, tools, devices, or possessions (use as last resort)"

  # Optional edge (fact) types. When a name matches a model registered in
  # src/models/edge_types.py the rich Pydantic model is used; otherwise a
  # documentation-only model is built from the description below. Leave this
  # list empty to keep graphiti-core's default edge extraction behavior.
  # edge_types:
  #   - name: "WorksFor"
  #     description: "Employment or membership of a person in an organization"
  #   - name: "LocatedAt"
  #     description: "An entity is situated at or within a location"

  # Optional constraint on which edge types may connect which entity types.
  # 'Entity' acts as a wildcard for either endpoint. Mirrors graphiti-core's
  # edge_type_map. Leave empty to allow any configured edge type anywhere.
  # edge_type_map:
  #   - source: "Person"
  #     target: "Organization"
  #     edge_types: ["WorksFor"]
  #   - source: "Entity"
  #     target: "Location"
  #     edge_types: ["LocatedAt"]

# Optional resilience for the episode write path. All values below are the
# defaults; the section can be omitted entirely. When enabled, a circuit
# breaker rejects new add_memory calls during LLM rate-limit/5xx waves (returning
# a "graphiti_backpressure:" error) and failed episodes are spooled to disk and
# replayed by a background retryer, surviving restarts.
# resilience:
#   enabled: true
#   max_queue_depth: 20
#   failure_threshold: 3
#   open_timeout_seconds: 30
#   spool_enabled: true
#   spool_dir: "~/.graphiti/spool"   # created on start; contains private episode content - keep ignored
#   retryer_interval_seconds: 15
#   spool_backoff_base_seconds: 30
#   max_spool_attempts: 10
#   # Durable SQLite write-ahead journal: when enabled, add_memory first writes
#   # each episode plan to the journal DB (WAL) and workers claim rows from it,
#   # so queued episodes survive a hard kill (SIGKILL) without loss. Backpressure
#   # and /health counts are read from journal rows, correct after a restart.
#   journal_enabled: true
#   journal_path: "~/.graphiti/journal.db"   # contains private episode content - keep ignored
#   journal_lease_seconds: 300.0
#   # Global journal worker pool size (phase 2): workers may claim from any
#   # group, but a per-group lock keeps each group strictly FIFO, so this only
#   # adds cross-group concurrency. Serial zones (no previous_episode_uuids,
#   # saga without saga_previous_episode_uuid, update_communities) are never
#   # parallelized.
#   journal_workers: 4
#   # Global cap on concurrent graphiti.add_episode calls (LLM extraction +
#   # graph write), shared by the journal pool and the direct add_memory path.
#   semaphore_limit: 10
#   # Lease steward: how often to reclaim processing rows whose owner vanished,
#   # and how far past an expired lease a row must be before another worker may
#   # take it. Rows owned by the live process are never stolen, so long in-flight
#   # LLM calls are never double-processed.
#   journal_steward_interval_seconds: 15
#   journal_grace_seconds: 60
#   # Multi-model failover (phase 3): ordered fallback LLM models (gateway IDs)
#   # tried by the journal worker when the active extraction model (llm.model)
#   # fails transiently for an episode (RateLimitError / empty response / 5xx).
#   # The whole episode is processed by ONE chosen model (graph consistency);
#   # fallbacks use the same max_tokens as llm.max_tokens. Order matters: the
#   # first not-yet-attempted model wins. An empty list disables failover.
#   # Cutover requires canary trials of the candidate on real long episodes
#   # (see ~/docs/research/graphiti-model-failover*.md).
#   model_fallbacks:
#     - "AgentLLM-default"
#   # Phase 4 - bounded breakthrough intake + per-model routing. While the breaker
#   # is OPEN, allow up to max_queue_depth + enqueue_breakthrough_max_pending new
#   # episodes so canaries / critical episodes still reach the durable journal and
#   # drain on a live fallback (per-model reputation prefers healthy channels).
#   # 0 keeps the default (open breaker rejects everything). Only meaningful
#   # together with a non-empty model_fallbacks - with no fallback a breakthrough
#   # just accumulates rows with nowhere to drain.
#   enqueue_breakthrough_max_pending: 5
#   # Per-model reputation window / 429 thresholds used to reorder failover
#   # candidates: healthy (live) channels are tried before a 429-storming primary.
#   model_reputation_window_seconds: 300.0
#   model_reputation_429_per_min_threshold: 5.0
#   model_reputation_429_cooldown_seconds: 60.0
